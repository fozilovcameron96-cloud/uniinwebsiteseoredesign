<!doctype html>
<html lang="ru">
  <head>
    <!--
      The Round 3 ad landing page (/start, /en/start), as its own entry point
      (18 Nov 2026). It used to load inside the main site, which made a phone on
      mobile data download the whole homepage's code (~320 KB) and two font
      families before the first question appeared: 2.7 s on a throttled test.
      vercel.json sends /start and /en/start here. The main app keeps a /start
      route too, as a fallback.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#F97316" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Universe In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint (media=print, then switched on):
         on mobile data, waiting for Google's stylesheet held the whole page
         blank. Text shows at once in the system font and swaps when it lands. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>
    <!-- Meta Pixel: keep in step with index.html. Off on local and home-network
         addresses so testing never sends events to Meta. -->
    <script>
      if (!/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)) {
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '545396509785203');
      fbq('track', 'PageView');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Our own step log (20 Nov 2026): the "landed" row in the Sheet's
      "Funnel (website)" tab, sent as soon as the page is on screen, before the
      form's code loads, so visitors who leave early are counted. StartForm.tsx
      logs the later steps with the same visit id (window.__uiVisit). No names
      or numbers. Off on local addresses, like the pixel.
      21 Nov 2026: a page an app loads in the background (hidden) isn't counted
      until it's actually shown ("preloaded"), and the first time it goes off
      screen sends "left" with the seconds it was open, so a visit that ends
      at the intro shows whether they read it or bounced. A tap also counts as
      shown, in case a phone never reports the page as visible.
    -->
    <script>
      (function () {
        if (/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)) return;
        try {
          var id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
          window.__uiVisit = id;
          var locked = false;
          try { var at = Number(localStorage.getItem('uni_in_start_filtered')); locked = !!at && Date.now() - at < 30 * 86400000; } catch (e) {}
          var q = new URLSearchParams(location.search);
          var send = function (step, answer) {
            var body = JSON.stringify({ visit: id, step: step, answer: answer,
              lang: /^\/en(\/|$)/.test(location.pathname) ? 'en' : 'ru', ad: q.get('utm_content') || '', ad_id: q.get('ad_id') || '' });
            if (navigator.sendBeacon) navigator.sendBeacon('https://silk-leads-dashboard.vercel.app/api/funnel', new Blob([body], { type: 'text/plain' }));
          };
          var hiddenAtLoad = document.visibilityState === 'hidden';
          var shownAt = 0, left = false;
          var show = function () {
            if (shownAt) return;
            shownAt = Date.now();
            send('landed', locked ? 'locked' : hiddenAtLoad ? 'preloaded' : '');
          };
          var leave = function () {
            if (!shownAt || left) return;
            left = true;
            send('left', Math.round((Date.now() - shownAt) / 1000) + 's');
          };
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') show(); else leave();
          });
          addEventListener('pagehide', leave);
          addEventListener('pointerdown', show, { once: true });
          if (!hiddenAtLoad) show();
        } catch (e) {}
      })();
    </script>
    <!--
      Instant intro (18 Nov 2026, "make sure it's very fast"). The intro screen
      is drawn here, straight from the HTML, so the headline shows as soon as
      the page arrives instead of after React and the form's code have loaded.
      React replaces it with the identical live screen a moment later. It must
      match StartForm.tsx's header and intro (same classes, same words), or
      the page visibly jumps. A tap on Start before React is ready is
      remembered (window.__uiStartTapped), so it isn't lost.
      Skipped for a visitor locked out by the £10k filter: they go straight to
      React's "not right now" screen.
    -->
    <script>
      (function () {
        try {
          var at = Number(localStorage.getItem('uni_in_start_filtered'));
          if (at && Date.now() - at < 30 * 86400000) return;
        } catch (e) {}
        var en = /^\/en(\/|$)/.test(location.pathname);
        // Parents ad (22 Nov 2026): its visitors get an intro that carries on
        // the ad's own headline, so a worried parent sees they're on the right
        // page. Only for visitors from an ad named "...Parents...", so a student
        // arriving from the main site isn't told "your child". Same test as
        // StartForm.tsx's fromParentsAd: the link's utm_content, else the ad
        // kept in sessionStorage.
        var adName = '';
        try { adName = new URLSearchParams(location.search).get('utm_content') || ''; } catch (e) {}
        if (!adName) { try { adName = JSON.parse(sessionStorage.getItem('uni_in_ad') || '{}').utm_content || ''; } catch (e) {} }
        var parents = !en && /parent/i.test(adName);
        var T = en
          ? { sub: 'Study abroad consultancy · London', h1: 'Study at a UK university from £10,000 a year',
              p: "Answer a few quick questions and we'll send you the universities that fit your budget.",
              time: 'Takes about 1 minute.', start: 'Start' }
          : parents
          ? { sub: 'Консультанты по учёбе за рубежом · Лондон', h1: 'Ваш ребёнок не будет один в Британии',
              lead: 'Наша команда в Лондоне поможет поступить в университет, встретит в аэропорту и будет рядом на каждом шагу. Обучение от £10 000 в год.',
              p: 'Ответьте на 5 коротких вопросов, и мы подберём университеты под ваш бюджет.',
              time: 'Около 1 минуты.', start: 'Начать' }
          : { sub: 'Консультанты по учёбе за рубежом · Лондон', h1: 'Учёба в университете Великобритании от £10 000 в год',
              p: 'Ответьте на несколько коротких вопросов, и мы пришлём вам университеты, которые подходят под ваш бюджет.',
              time: 'Около 1 минуты.', start: 'Начать' };
        var on = 'bg-white text-orange-600', off = 'bg-white/20 text-white';
        document.documentElement.lang = en ? 'en' : 'ru';
        document.getElementById('root').innerHTML =
          '<div class="min-h-screen bg-[#F0F2F5] sm:py-8"><div class="mx-auto w-full max-w-[440px] bg-white sm:rounded-2xl sm:shadow-sm overflow-hidden min-h-screen sm:min-h-0">' +
          '<div class="relative h-24" style="background:linear-gradient(135deg,#F97316,#D95F00)">' +
            '<div class="absolute top-3 right-3 flex gap-1">' +
              '<span class="px-2.5 py-1 rounded-md text-xs font-bold ' + (en ? off : on) + '">RU</span>' +
              '<span class="px-2.5 py-1 rounded-md text-xs font-bold ' + (en ? on : off) + '">EN</span>' +
            '</div>' +
            '<img src="/logo-round.png" alt="Universe In" width="56" height="56" class="absolute -bottom-7 left-5 w-14 h-14 rounded-full object-cover bg-black ring-4 ring-white shadow">' +
          '</div>' +
          '<div class="pl-[88px] pr-5 pt-2 pb-3"><div class="font-bold text-gray-900 leading-tight">Universe In</div><div class="text-xs text-gray-500">' + T.sub + '</div></div>' +
          '<div class="h-1 bg-gray-100"><div class="h-1" style="width:0%;background:#F97316"></div></div>' +
          '<div class="px-5 pt-6 pb-10"><div>' +
            '<h1 class="text-[22px] font-bold text-gray-900 leading-snug">' + T.h1 + '</h1>' +
            (T.lead ? '<p class="mt-3 text-[15px] text-gray-600 leading-relaxed">' + T.lead + '</p>' : '') +
            '<p class="mt-3 text-[15px] text-gray-600 leading-relaxed">' + T.p + '</p>' +
            '<p class="mt-2 text-sm text-gray-400">' + T.time + '</p>' +
            '<button type="button" onclick="window.__uiStartTapped=1;this.style.opacity=0.7" class="w-full py-4 rounded-xl text-white text-base font-bold mt-7" style="background:#F97316">' + T.start + '</button>' +
          '</div></div></div></div>';
      })();
    </script>
    <script type="module" src="/src/start-main.tsx"></script>
  </body>
</html>
